# ================================
# Production Configuration
# ================================
# Inherits from application.properties
# Run with: java -jar finance-hub.jar --spring.profiles.active=prod

# --------------------------------
# Vaadin
# --------------------------------
vaadin.launch-browser=false
vaadin.productionMode=true

# --------------------------------
# Database (configure via environment variables)
# --------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finance_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings for production
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# --------------------------------
# Security (enable for HTTPS)
# --------------------------------
server.servlet.session.cookie.secure=true

# Trust X-Forwarded-* headers from reverse proxy
server.forward-headers-strategy=native

# --------------------------------
# Logging
# --------------------------------
logging.level.root=WARN
logging.level.com.jameselner.finance_hub=INFO
logging.file.name=${LOG_PATH:/var/log/finance-hub}/finance-hub.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
