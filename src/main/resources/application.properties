# ================================
# Common Configuration (Parent)
# ================================
# Profile-specific configs inherit from this file.
# Use -Dspring.profiles.active=local or -Dspring.profiles.active=prod

spring.application.name=Finance Hub

# --------------------------------
# JPA / Hibernate (shared settings)
# --------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --------------------------------
# Flyway (shared settings)
# --------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true

# --------------------------------
# Server settings
# --------------------------------
server.port=8080
server.error.include-stacktrace=never

# --------------------------------
# Security
# --------------------------------
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
