# ================================
# Local Development Configuration
# ================================
# Inherits from application.properties
# Run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local

# --------------------------------
# Vaadin
# --------------------------------
vaadin.launch-browser=true

# --------------------------------
# Database (docker-compose PostgreSQL)
# --------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/financehub
spring.datasource.username=financehub
spring.datasource.password=financehub
spring.datasource.driver-class-name=org.postgresql.Driver

# --------------------------------
# Development Logging (uncomment as needed)
# --------------------------------
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
